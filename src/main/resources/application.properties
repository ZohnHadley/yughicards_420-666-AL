spring.application.name=yughistore
spring.datasource.username=yugy
spring.datasource.password=muto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres

spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.model=llama3.2:1b
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.chat.include=true
spring.ai.ollama.init.pull-model-strategy=when_missing

spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false

application.security.jwt.expiration=86400000
application.security.jwt.reset-expiration=900000
application.security.jwt.secret-key=2B7E151628AED2A6ABF7158809CF4F3C2B7E151628AED2A6ABF7158809CF4F3C

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=900MB
spring.docker.compose.file=./compose.yaml